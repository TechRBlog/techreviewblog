<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sharing Functionality - TechReviewBlog</title>

    <!-- Test meta tags -->
    <meta name="description" content="Testing social media sharing functionality for TechReviewBlog with all platforms and copy link feature.">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Test Sharing Functionality - TechReviewBlog">
    <meta property="og:description" content="Testing social media sharing functionality for TechReviewBlog with all platforms and copy link feature.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://techreviewblog.com/test-sharing.html">
    <meta property="og:image" content="https://techreviewblog.com/assets/rtx50.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="TechReviewBlog">

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 100px 20px 20px;
            background-color: #0a192f;
            color: white;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .test-buttons {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }
        .test-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            background-color: #1a2332;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }
        .test-btn.facebook:hover { background-color: #1877f2; }
        .test-btn.twitter:hover { background-color: #1da1f2; }
        .test-btn.reddit:hover { background-color: #ff4500; }
        .test-btn.linkedin:hover { background-color: #0077b5; }
        .test-btn.whatsapp:hover { background-color: #25d366; }
        .test-btn.copy-link:hover { background-color: #00d4ff; color: #0a192f; }

        .result {
            margin-top: 30px;
            padding: 15px;
            background-color: #1a2332;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Sharing Functionality Test</h1>
        <p>Click each button below to test the social media sharing functionality:</p>

        <div class="test-buttons">
            <button onclick="testFacebook()" class="test-btn facebook">
                <span>📘</span> Test Facebook Sharing
            </button>

            <button onclick="testTwitter()" class="test-btn twitter">
                <span>🐦</span> Test Twitter Sharing
            </button>

            <button onclick="testReddit()" class="test-btn reddit">
                <span>🔴</span> Test Reddit Sharing
            </button>

            <button onclick="testLinkedIn()" class="test-btn linkedin">
                <span>💼</span> Test LinkedIn Sharing
            </button>

            <button onclick="testWhatsApp()" class="test-btn whatsapp">
                <span>💬</span> Test WhatsApp Sharing
            </button>

            <button onclick="testCopyLink()" class="test-btn copy-link">
                <span>🔗</span> Test Copy Link
            </button>
        </div>

        <div class="result" id="testResult" style="display: none;">
            <h3>Test Results:</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function showResult(platform, status, message) {
            const resultDiv = document.getElementById('testResult');
            const contentDiv = document.getElementById('resultContent');

            resultDiv.style.display = 'block';
            contentDiv.innerHTML += `
                <p><strong>${platform}:</strong>
                <span style="color: ${status === 'success' ? '#00ff88' : '#ff6666'}">
                ${status === 'success' ? '✅' : '❌'} ${message}
                </span></p>
            `;
        }

        function testFacebook() {
            try {
                shareOnFacebook();
                showResult('Facebook', 'success', 'Share dialog opened successfully');
            } catch (error) {
                showResult('Facebook', 'error', 'Error: ' + error.message);
            }
        }

        function testTwitter() {
            try {
                shareOnTwitter();
                showResult('Twitter', 'success', 'Tweet composer opened successfully');
            } catch (error) {
                showResult('Twitter', 'error', 'Error: ' + error.message);
            }
        }

        function testReddit() {
            try {
                shareOnReddit();
                showResult('Reddit', 'success', 'Reddit submit page opened successfully');
            } catch (error) {
                showResult('Reddit', 'error', 'Error: ' + error.message);
            }
        }

        function testLinkedIn() {
            try {
                shareOnLinkedIn();
                showResult('LinkedIn', 'success', 'LinkedIn share dialog opened successfully');
            } catch (error) {
                showResult('LinkedIn', 'error', 'Error: ' + error.message);
            }
        }

        function testWhatsApp() {
            try {
                shareOnWhatsApp();
                showResult('WhatsApp', 'success', 'WhatsApp share opened successfully');
            } catch (error) {
                showResult('WhatsApp', 'error', 'Error: ' + error.message);
            }
        }

        function testCopyLink() {
            try {
                copyLinkToClipboard();
                // Wait a bit to see if the notification appears
                setTimeout(() => {
                    showResult('Copy Link', 'success', 'Copy function executed - check for notification');
                }, 100);
            } catch (error) {
                showResult('Copy Link', 'error', 'Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
